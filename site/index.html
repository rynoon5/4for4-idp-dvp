:root{
  --ground:#F3F6F2; --surface:#FFFFFF; --ink:#1B2822; --muted:#5F6F67; --line:#D6DED8; --line2:#E9EEEA;
  --accent:#1F6B4F; --accent-ink:#FFFFFF; --over:47,143,91; --under:195,74,62; --chip:#E4ECE6;
  --hdr:#EEF3EF; --sticky:#F8FAF8; --shhi:63,92,196; --shlo:214,143,36;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font:14px/1.45 "Chivo",system-ui,sans-serif;padding-block:18px 40px;padding-inline:16px}
.wrap{max-width:1500px;margin:0 auto}
h1{font:400 24px/1.1 "Archivo Black","Arial Black",sans-serif;margin:0;letter-spacing:.01em;text-wrap:balance}
.sub{color:var(--muted);margin:6px 0 0;font-size:13px}
.bar{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:flex-end;margin:16px 0 12px}
.ctl{display:flex;flex-direction:column;gap:5px}
.ctl label{font:600 11px/1 "Chivo",system-ui,sans-serif;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;color:var(--ink);padding:7px 12px;font:500 13px "Chivo",sans-serif;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.legend{margin-left:auto;display:flex;gap:14px;align-items:center;color:var(--muted);font-size:12px;flex-wrap:wrap}
.sw{display:inline-block;width:38px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:1180px;font-variant-numeric:tabular-nums}
th,td{padding:0;border-bottom:1px solid var(--line2);text-align:right;white-space:nowrap}
th{position:sticky;top:0;z-index:3;background:var(--hdr);font:600 12px/1.2 "Chivo",system-ui,sans-serif;letter-spacing:.02em;color:var(--ink);padding:8px 8px;vertical-align:bottom;cursor:pointer;user-select:none}
th .avg{display:block;font:500 11px "Chivo",sans-serif;color:var(--muted);margin-top:3px}
th.grp{text-align:center;cursor:default;border-bottom:1px solid var(--line);padding:6px 8px 4px;font-size:13px;color:var(--accent)}
th.sorted::after{content:" ▾";color:var(--accent)}
th.sorted.asc::after{content:" ▴"}
td{padding:5px 8px}
td.team,th.team{text-align:left;position:sticky;left:0;z-index:2;background:var(--sticky);font:700 15px "Chivo",system-ui,sans-serif;border-right:1px solid var(--line)}
th.team{z-index:4}
td .g{font-size:11px;color:var(--muted);font-weight:500;font-family:"Chivo",sans-serif;margin-left:6px}
td.sep,th.sep{border-left:1px solid var(--line)}
.v{display:block;font-size:14px;font-weight:600;line-height:1.15}
.i{display:block;font-size:11.5px;line-height:1.15;color:var(--muted)}
.o{display:block;font-size:10.5px;line-height:1.2;color:var(--muted);opacity:.85;margin-top:2px}
.rk{color:var(--muted);font-size:12px;width:34px}
.sh{font-size:12px}
.sh .v{font-size:13px;font-weight:500;color:var(--ink)}
tr:hover td{filter:brightness(.97)}
.foot{margin-top:14px;color:var(--muted);font-size:12px;max-width:72ch}
.foot b{color:var(--ink);font-weight:600}
@media (max-width:640px){ h1{font-size:22px} .legend{margin-left:0} }
</style>
<div class="wrap">
  <h1>IDP Position vs Team</h1>
  <p class="sub" id="sub"></p>
  <div class="bar">
    <div class="ctl"><label>Stat</label><div class="seg" id="stat">
      <button data-v="ta" aria-pressed="true">Tackles + Assists</button><button data-v="sk" aria-pressed="false">Sacks</button></div></div>
    <div class="ctl"><label>Season</label><div class="seg" id="view">
      <button data-v="blend" aria-pressed="true">Blend</button><button data-v="base" aria-pressed="false">2025</button><button data-v="live" aria-pressed="false">2026</button></div></div>
    <div class="ctl"><label>Basis</label><div class="seg" id="basis">
      <button data-v="pg" aria-pressed="true">Per game</button><button data-v="pp" aria-pressed="false">Per 100 plays</button></div></div>
    <div class="legend"><span><i class="sw" style="background:rgba(var(--over),.6)"></i>more allowed than avg</span><span><i class="sw" style="background:rgba(var(--under),.6)"></i>less</span><span>index = team ÷ league avg</span><span><i class="sw" style="background:rgba(var(--shhi),.55)"></i>share above avg</span><span><i class="sw" style="background:rgba(var(--shlo),.55)"></i>below</span></div>
  </div>
  <div class="tblwrap"><table id="t"></table></div>
  <p class="foot" id="foot"></p>

  for(const r of out){ r.rk={}; for(const g of G.concat('ALL')) r.rk[g]=rank[g][r.team]; }
  return {out,avg,pavg};
}
function shade(idx){ if(idx==null) return ''; const d=Math.max(-.35,Math.min(.35,idx-1)); const a=Math.min(.78, Math.abs(d)/.35*.78); return `background:rgba(var(--${d>=0?'over':'under'}),${a.toFixed(2)})`; }
function shadeShare(sh,avgSh){ if(sh==null||!avgSh) return ''; const d=Math.max(-.2,Math.min(.2,(sh-avgSh)/avgSh)); const a=Math.min(.7,Math.abs(d)/.2*.7); return `background:rgba(var(--${d>=0?'shhi':'shlo'}),${a.toFixed(2)})`; }
function f(x,d){ return x==null||isNaN(x)?'—':x.toFixed(d); }
function pct(x){ return x==null?'—':(x*100).toFixed(1)+'%'; }
function cell(r,g,d){
  const v=r.v[g], o=(r.o25[g]!=null||r.o26[g]!=null) ? `<span class="o">25 ${f(r.o25[g],d)} · 26 ${f(r.o26[g],d)}</span>` : '';
  return `<td style="${shade(r.idx[g])}"><span class="v">${f(v,d)}</span><span class="i">${pct(r.idx[g])}</span>${o}</td>`;
}
function render(){
  const {out,avg,pavg}=rows();
  const {stat,view,basis}=state; const d = stat==='sk'?2:1;
  const key=state.sort;
  out.sort((a,b)=>{ const x= key==='team'? (a.team<b.team?-1:1) : key==='plays'? a.plays-b.plays : key.startsWith('sh:')? a.sh[key.slice(3)]-b.sh[key.slice(3)] : a.v[key]-b.v[key]; return state.asc? x : -x; });
  const unit = basis==='pg' ? '/G' : '/100 plays';
  const sn = stat==='ta'?'T+A':'Sacks';
  const sortCls=k=> k===key? `sorted${state.asc?' asc':''}`:'';
  let h=`<thead><tr><th class="team" rowspan="2" data-k="team">Offense faced <span class="avg">games 25 · 26</span></th>
    <th rowspan="2" data-k="plays" class="${sortCls('plays')}">Plays/G<span class="avg">avg ${f(pavg,1)}</span></th>
    <th rowspan="2" data-k="ALL" class="sep ${sortCls('ALL')}">Total ${sn}${unit}<span class="avg">avg ${f(avg.ALL,d)}</span></th>`;
  for(const g of G) h+=`<th class="grp sep" colspan="3">${g}</th>`;
  h+=`</tr><tr>`;
  for(const g of G) h+=`<th class="sep rk">#</th><th data-k="${g}" class="${sortCls(g)}">${sn}${unit}<span class="avg">avg ${f(avg[g],d)}</span></th><th data-k="sh:${g}" class="${sortCls('sh:'+g)}">share<span class="avg">avg ${pct(avg[g]/avg.ALL)}</span></th>`;
  h+=`</tr></thead><tbody>`;
  for(const r of out){
    h+=`<tr><td class="team">${r.team}<span class="g">${r.b?r.b.g:0} · ${r.l?r.l.g:0}</span></td><td><span class="v">${f(r.plays,1)}</span><span class="i">${r.b?f(r.b.plays/r.b.g,1):'—'} · ${r.l?f(r.l.plays/r.l.g,1):'—'}</span></td>`;
    h+=cell(r,'ALL',d).replace('<td ','<td class="sep" ');
    for(const g of G) h+=`<td class="sep rk">${r.rk[g]}</td>`+cell(r,g,d)+`<td class="sh" style="${shadeShare(r.sh[g], avg[g]/avg.ALL)}"><span class="v">${pct(r.sh[g])}</span><span class="i">${r.o25[g]!=null&&r.o25.ALL?pct(r.o25[g]/r.o25.ALL):'—'} · ${r.o26[g]!=null&&r.o26.ALL?pct(r.o26[g]/r.o26.ALL):'—'}</span></td>`;
    h+=`</tr>`;
  }
  document.getElementById('t').innerHTML=h+'</tbody>';
  document.querySelectorAll('th[data-k]').forEach(th=>th.onclick=()=>{ const k=th.dataset.k; if(state.sort===k) state.asc=!state.asc; else {state.sort=k; state.asc=(k==='team');} save(); render(); });
  const w = out.find(r=>r.l); const g26 = w? Math.max(...out.map(r=>r.l?r.l.g:0)) : 0;
  document.getElementById('sub').textContent = `What each offense gives up to each defensive position group. 2025 REG (18 wks) as the base, 2026 through week ${D.week}. `
    + (view==='blend' ? `Blend weight on 2026 = g/(g+${K}) → ${(g26/(g26+K)*100).toFixed(0)}% after ${g26} games.` : view==='base' ? '2025 only.' : '2026 only — a handful of games; read the tails, not the middle.');
  try{ localStorage.setItem('idpdvp', JSON.stringify(state)); }catch(e){}
}
function save(){ try{ localStorage.setItem('idpdvp', JSON.stringify(state)); }catch(e){} }
for(const id of ['stat','view','basis']){
  const seg=document.getElementById(id);
  seg.querySelectorAll('button').forEach(b=>{ b.setAttribute('aria-pressed', String(b.dataset.v===state[id])); b.onclick=()=>{ state[id]=b.dataset.v; seg.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed', String(x===b))); save(); render(); }; });
}
document.getElementById('foot').innerHTML = `<b>Method.</b> Rows are the offense a defender faces. Tackles and sacks come from nflverse's play-by-play-derived weekly stat lines (solo + assists = T+A); plays per game from raw pbp (rush + pass incl. sacks), REG only. Position group is the IDP Truth doc (${D.truth}) first, then nflverse with OLB → DE, MLB/ILB → LB, NT → DT, FS/SS → S. Every cell shows the headline number, its index vs the league average, and the 2025 · 2026 values underneath. Share = the group's slice of the team's total. Built ${D.built}.`;
render();
</script>
